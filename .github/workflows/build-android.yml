name: Build Android APK

# 在 GitHub 的 Ubuntu runner 上构建 release APK。
#
# 为什么需要这个工作流
# --------------------
# 本仓库此前只有 iOS 工作流，Android 包一直靠人工在别处打。书架同步功能
# 上线后需要在两台设备上验证，手动打包太费事；而且 Android 侧的代码从来
# 没在 CI 里编译过，隐藏问题没有暴露的机会。
#
# 签名说明
# --------
# android/app/build.gradle.kts 里已经写了降级逻辑：
#   有 android/key.properties  -> 用正式证书签名
#   没有                        -> 回退 debug 签名
# 仓库里不放私钥，所以默认产出的是 **debug 签名的 release 包**。
# 这种包可以直接安装到自己的设备上，但不能上架应用商店。
#
# 如果确实要用正式签名，把 keystore 的 base64 存进仓库 Secrets，
# 本工作流会在构建前还原它（见 Restore release keystore 步骤）。
#
# 触发方式：
#   * 手动：Actions → Build Android APK → Run workflow
#   * 打 tag：推送 v1.2.0 这类 tag 会自动构建并把 apk 附加到 Release

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter 版本（留空则用默认 3.38.x）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    # Android 产物在 Linux 上就能编，比 macOS runner 便宜也快
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 iOS 工作流保持一致：pubspec.yaml 要求 sdk: ^3.10.8，
          # Flutter 3.38.9 自带 Dart 3.10.8，是满足条件的最小版本。
          flutter-version: ${{ inputs.flutter_version || '3.38.9' }}
          channel: stable
          cache: true

      - name: Show toolchain and verify Dart version
        run: |
          set -euo pipefail
          flutter --version
          dart --version

          DART_VER="$(dart --version 2>&1 | sed -E 's/.*version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "Dart SDK detected: ${DART_VER}"
          if [ -z "${DART_VER}" ]; then
            echo "::error::Could not parse the Dart version"
            exit 1
          fi
          LOWEST="$(printf '%s\n' '3.10.8' "${DART_VER}" | sort -V | head -n 1)"
          if [ "${LOWEST}" != "3.10.8" ]; then
            echo "::error::Dart ${DART_VER} is older than the 3.10.8 required by pubspec.yaml"
            exit 1
          fi
          echo "Dart version OK"

      - name: Install dependencies
        run: flutter pub get

      # 静态分析：Android 侧代码此前从未在 CI 编译过，
      # 先跑 analyze 能让错误停在更便宜的一步。
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # 只有在仓库配置了 RELEASE_KEYSTORE_BASE64 时才启用正式签名。
      # 没有这个 secret 就跳过，build.gradle.kts 会自动回退 debug 签名。
      - name: Restore release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "未配置 RELEASE_KEYSTORE_BASE64，将使用 debug 签名（可直接安装到自己的设备）"
            exit 0
          fi
          echo "::add-mask::${KEYSTORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"
          mkdir -p android
          echo "${KEYSTORE_BASE64}" | base64 -d > android/abts-release.jks
          # 用 printf 而不是 heredoc：YAML 块标量会连缩进一起写进文件，
          # 而 Java 的 Properties.load() 会把前导空格当成 key 的一部分，
          # 导致签名配置读不出来。printf 每行从行首开始，不会带缩进。
          {
            printf 'storeFile=abts-release.jks\n'
            printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD}"
          } > android/key.properties
          echo "已还原正式签名证书"

      - name: Build APK
        run: |
          set -euo pipefail
          # 版本号：tag 触发时用 tag 名（去掉 v），手动触发时回落到 1.3.0。
          # 不能直接用 GITHUB_REF_NAME —— 手动触发时它是分支名 "main"，
          # Gradle 会因为版本号不是数字而构建失败。
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          else
            BUILD_NAME="1.3.0"
          fi
          echo "构建版本: ${BUILD_NAME} (build ${GITHUB_RUN_NUMBER})"
          flutter build apk --release \
            --build-name "${BUILD_NAME}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          ls -lh build/app/outputs/flutter-apk/

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到 $APK"
            ls -R build/app/outputs || true
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK 大小: $((SIZE/1024/1024)) MB"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::APK 小于 5 MB，很可能构建不完整"
            exit 1
          fi
          # 确认签名存在（debug 或 release 都算）
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" || true
          fi
          echo "### 产物信息" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-release.apk"
          DEST="abts-android.apk"
          cp "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abts-android-apk
          path: abts-android.apk
          if-no-files-found: error
          retention-days: 30

      # 打 tag 时把 apk 附加到 Release，和 iOS 的 ipa 并列
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: abts-android.apk
          fail_on_unmatched_files: false
